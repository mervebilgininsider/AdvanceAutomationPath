version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: test-metrics-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
      - ./mongodb-init.js:/docker-entrypoint-initdb.d/mongodb-init.js:ro
    networks:
      - test-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: test-metrics-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-mongodb-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - test-network
    depends_on:
      - mongodb

volumes:
  mongodb_data:
  grafana_data:

networks:
  test-network:
    driver: bridge
